name: Linux

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "on"
  RUSTC_WRAPPER: "sccache"

jobs:
  Linux:
    name: Ubuntu-24.04
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Rust Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: "true"
          cache-workspace-crates: "true"

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@main

      - name: Build Release
        run: |
          cargo update
          set +e -x

          targets=(
            x86_64-unknown-linux-gnu
          )

          for target in ${targets[@]}; do
            time cargo s $target
          done

          find ./target -iname zeroclaw -type f | xargs ls -hl
          lscpu
          free -m

      - name: Rust Versions
        run: rustup -V; cargo -Vv; rustc -Vv

      - name: Upload binaries to a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          targets=(
              "x86_64-unknown-linux-gnu zeroclaw-x86_64"
          )
          for target in "${targets[@]}"; do
            read -r arch name <<< "$target"
            echo "Uploading $name..."
            for d in src redox; do
                if [ -d "target/$arch/$d" ]; then
                  mv target/$arch/$d/zeroclaw target/$arch/$d/$name || true
                  gh release upload Nightly target/$arch/$d/$name --clobber || true
                  break
                fi
            done
          done
